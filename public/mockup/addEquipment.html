<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add equipment | Networking Lab Inventory (UI preview)</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="dashboard.html">Networking Lab Inventory</a>
    <nav>
      <a href="dashboard.html">Equipment</a>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1>Add equipment</h1>
    </div>

    <div class="card">
      <form class="stack">
        <div class="field">
          <label for="assetTag">Asset tag</label>
          <input type="text" id="assetTag" name="assetTag" placeholder="e.g. NET-SW-001">
        </div>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Cisco Catalyst 2960 Switch">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select a category</option>
            <option value="Switch">Switch</option>
            <option value="Router">Router</option>
            <option value="Firewall">Firewall</option>
            <option value="Cable">Cable</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="e.g. Rack A, Room LB-465">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="Available">Available</option>
            <option value="In use">In use</option>
            <option value="Under repair">Under repair</option>
          </select>
        </div>

        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Optional notes"></textarea>
        </div>

        <div class="form-actions">
          <a class="btn btn-primary" href="dashboard.html">Add equipment</a>
          <a class="btn" href="dashboard.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
